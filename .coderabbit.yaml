# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
tone_instructions: >-
  Prioritize data integrity, runtime correctness, and PII on exfiltration surfaces (URLs, logs, payloads, responses). Same-device drafts are owner-approved — see path_instructions. Flag sync setState in effects, non-atomic writes, error logging.
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - dev
  path_filters:
    - '!pnpm-lock.yaml'
    - '!messages/**'
    - '!docs/**'
    - '!.opencode/**'
  path_instructions:
    - path: app/api/**
      instructions: >-
        Verify every route enforces auth via getSession() and role checks before data access,
        validates input with zod, and never logs request bodies, tokens, or PII.
    - path: lib/auth/**
      instructions: >-
        Focus on JWT/session handling correctness (HS256, expiry), secret hygiene, and that no
        token material is ever logged or exposed in responses.
    - path: modules/orders/**
      instructions: >-
        Verify multi-table writes are atomic for the driver (neon-http has no
        transactions — use db.batch), totals are computed server-side, and
        inventory deduction never runs after a failed availability check.
    - path: lib/inventory-management.ts
      instructions: >-
        Stock changes must be atomic conditional decrements, not
        read-modify-write; movements recorded only after successful decrements.
    - path: e2e/**
      instructions: >-
        Locators must be strict-mode safe (no ambiguous getByText regexes),
        avoid asserting on toast wrapper duplication, and keep environment
        assumptions explicit.
    - path: test/**
      instructions: >-
        Mocks must mirror real driver constraints (e.g. neon-http batch/transaction
        support) so green tests cannot mask runtime breakage.
    - path: store/**
      instructions: >-
        Same-device localStorage drafts (cart items, checkout contact,
        offline queue) are owner-approved. Do not flag PII at rest here;
        verify shape-validation on rehydrate (corrupt → fallback),
        manual rehydration gating for SSR pages, and that no draft data is
        transmitted except inside the existing order submit payload.
    - path: modules/core/hooks/use-offline-orders.ts
      instructions: >-
        Established precedent for the approved localStorage-draft pattern
        (person details included). Judge store/** changes against it.
    - path: proxy.ts
      instructions: >-
        Public catalog is by design (/, /products incl. /products/[id],
        /order). Only flag newly exposed auth-gated surfaces
        (/dashboard/*, /profile/*) or weakened role checks.
    - path: lib/log-error.ts
      instructions: >-
        The BLOCKED_KEYS allowlist is intentional privacy-by-design; never
        ask to log PII, bodies, tokens, or user agents. Debuggability comes
        from correlation IDs (order/tracking/ingredient) and curated
        messages — flag their absence instead.
