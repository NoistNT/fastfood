name: 'Setup Node.js and pnpm'
description: 'Setup Node.js 24, pnpm 11, and cache dependencies'

inputs:
  frozen-lockfile:
    description: 'Use frozen lockfile for install'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Setup pnpm
      uses: pnpm/action-setup@v5
      with:
        version: 11
        run_install: false
        cache: true

    - name: Install dependencies
      shell: bash
      run: |
        status=1
        for attempt in 1 2 3; do
          status=0
          if [ "${{ inputs.frozen-lockfile }}" = "true" ]; then
            pnpm install --frozen-lockfile || status=$?
          else
            pnpm install || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            break
          fi
          echo "::warning::pnpm install failed (attempt $attempt of 3); retrying in 10 seconds"
          sleep 10
        done
        exit "$status"
