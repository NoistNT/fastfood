name: Demo Reseed

on:
  schedule:
    # Daily 04:00 America/Argentina/Buenos_Aires (UTC-3) — heals any
    # showcase defacement within 24h.
    - cron: '0 7 * * *'
  # Manual reset when the showcase is defaced mid-day.
  workflow_dispatch:

# SAFETY: SHOWCASE_DB_URL must point ONLY at the showcase Neon branch.
# Never dev/CI branches (E2E depends on them), never client branches.
# One run at a time — a second reset racing the first is how deadlocks happen.
concurrency:
  group: demo-reseed
  cancel-in-progress: false

jobs:
  reseed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          frozen-lockfile: 'true'

      - name: Reset and seed showcase database
        run: pnpm exec tsx scripts/demo-reseed.ts
        env:
          SHOWCASE_DB_URL: ${{ secrets.SHOWCASE_DB_URL }}
