name: Vercel Preview Deployment

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

# Superseded runs are cancelled so deployments and the sticky comment
# never race into duplicates or stale URLs.
concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write
      issues: write

    env:
      DB_URL: postgresql://mock:mock@localhost:5432/mockdb
      NEXT_PUBLIC_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          frozen-lockfile: 'true'

      - name: Lint check
        run: pnpm lint

      - name: Build check
        run: pnpm build

      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v42.3.0
        id: vercel-deployment
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ${{ github.workspace }}

      # Sticky comment: exactly one per PR, updated in place on every push.
      # The deployment URL travels via env (never interpolated into the
      # script source) to rule out template injection.
      - name: Comment deployment URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_URL: ${{ steps.vercel-deployment.outputs.preview-url }}
        with:
          script: |
            const deploymentUrl = process.env.VERCEL_URL || process.env.DEPLOYMENT_URL;
            const marker = '<!-- preview-deployment -->';

            const commentBody = `${marker}
            ## 🚀 Preview Deployment Ready

            **Preview URL:** ${deploymentUrl}

            This preview includes all the latest changes from this PR. The deployment will be automatically updated when you push new commits.

            ### ✅ Checks Passed:
            - ✅ Code linting
            - ✅ TypeScript compilation
            - ✅ Build verification
            - ✅ Vercel deployment

            ### 🔍 Testing:
            - [ ] Manual testing completed
            - [ ] Visual regression tested
            - [ ] Performance verified`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const mine = comments.filter(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker)
            );

            // Reconcile duplicates from historical runs: keep the first,
            // remove any extras.
            if (mine.length > 0) {
              await github.rest.issues.updateComment({
                comment_id: mine[0].id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody,
              });
              for (const extra of mine.slice(1)) {
                await github.rest.issues.deleteComment({
                  comment_id: extra.id,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                });
              }
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody,
              });
            }
