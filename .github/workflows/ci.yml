name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# E2E jobs reset and seed a shared database; overlapping runs deadlock on it
# (seen on dev: two pushes 4s apart raced reset vs seed). One run per ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DB_URL: postgresql://mock:mock@localhost:5432/mockdb
      NEXT_PUBLIC_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          frozen-lockfile: 'true'

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright

      - name: Lint and Type Check
        run: pnpm lint

      - name: Run Unit Tests
        run: pnpm test:run

      - name: Build Application
        run: pnpm build

      - name: Start server for E2E tests
        run: pnpm start &
        env:
          DB_URL: postgresql://mock:mock@localhost:5432/mockdb
          NEXT_PUBLIC_BASE_URL: http://localhost:3000

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run E2E Tests
        run: pnpm exec playwright test --project=chromium
        env:
          CI: true

  # Runs the database-backed user journey against a dedicated (seeded) database.
  # Requires both CI_E2E_DB_URL and CI_E2E_SESSION_SECRET secrets. Secrets are
  # not readable in job-level `if`, so a tiny gate job exposes a flag instead;
  # the journey job is skipped until both secrets are configured.
  e2e-journey-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CHECK_DB_URL: ${{ secrets.CI_E2E_DB_URL }}
          CHECK_SESSION_SECRET: ${{ secrets.CI_E2E_SESSION_SECRET }}
        run: |
          if [ -n "$CHECK_DB_URL" ] && [ -n "$CHECK_SESSION_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-journey:
    needs: e2e-journey-gate
    if: needs.e2e-journey-gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DB_URL: ${{ secrets.CI_E2E_DB_URL }}
      SESSION_SECRET: ${{ secrets.CI_E2E_SESSION_SECRET }}
      NEXT_PUBLIC_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          frozen-lockfile: 'true'

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright

      # Applies the repo's canonical SQL pair (single source of truth with
      # db/schema.ts); doubles as a drift canary on every PR run.
      - name: Reset and seed database
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/sql/dev-reset.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/sql/dev-seed-minimal.sql

      - name: Build Application
        run: pnpm build

      - name: Start server for journey E2E
        run: pnpm start &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run User Journey E2E
        run: pnpm exec playwright test --project=chromium e2e/user-journey.spec.ts
        env:
          CI: true
          E2E_DB_URL: 'true'
